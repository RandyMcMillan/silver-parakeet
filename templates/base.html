<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}Route Optimizer{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/collapse-icons.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <i data-feather="navigation"></i>
                Route Optimizer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.index') }}">
                            <i data-feather="home"></i>
                            Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='leaflet_route_map.js') }}"></script>
    
    <!-- Initialize Feather Icons -->
    <script>
        feather.replace();
        
        // Handle route generation with direct UI refresh
        function handleRouteGeneration(button) {
            // Update button state
            button.innerHTML = '<i data-feather="clock"></i> Generating...';
            button.disabled = true;
            
            // Set timeout fallback
            const timeout = setTimeout(() => {
                if (button.disabled) {
                    button.innerHTML = '<i data-feather="alert-circle"></i> Timeout - Try Again';
                    button.disabled = false;
                    feather.replace();
                }
            }, 15000);
            
            // Clear timeout when page starts to redirect
            window.addEventListener('beforeunload', () => {
                clearTimeout(timeout);
            });
        }
        
        // Update driver count and regenerate routes
        function updateDriverCount() {
            const numDrivers = document.getElementById('num_drivers').value;
            const startTime = document.getElementById('start_time').value;
            const updateBtn = document.getElementById('updateDriverBtn');
            
            // Save driver count to localStorage as backup
            localStorage.setItem('lastDriverCount', numDrivers);
            
            // Update button state
            updateBtn.innerHTML = '<i data-feather="clock"></i> Updating...';
            updateBtn.disabled = true;
            
            // Create form data and submit
            const formData = new FormData();
            formData.append('num_drivers', numDrivers);
            formData.append('start_time', startTime);
            
            fetch('/generate_routes', {
                method: 'POST',
                body: formData,
                headers: {
                    'Cache-Control': 'no-cache'
                }
            }).then(response => {
                console.log('Route generation response:', response);
                if (response.redirected) {
                    // Force immediate page reload with cache bypass
                    const timestamp = Date.now();
                    console.log('Redirect detected, reloading with timestamp:', timestamp);
                    window.location.href = window.location.pathname + '?update=' + timestamp;
                } else {
                    // If no redirect, force a manual reload anyway
                    console.log('No redirect, forcing manual reload');
                    setTimeout(() => {
                        window.location.reload(true);
                    }, 500);
                }
            }).catch(error => {
                console.error('Route generation error:', error);
                updateBtn.innerHTML = '<i data-feather="alert-circle"></i> Error - Try Again';
                updateBtn.disabled = false;
                feather.replace();
            });
        }
        
        // Handle both form redirect and update button refresh
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('refresh') === 'routes' || urlParams.get('update') || urlParams.get('v')) {
            console.log('Route refresh detected, forcing reload...');
            console.log('URL params:', urlParams.toString());
            
            // Clear URL history immediately  
            window.history.replaceState({}, document.title, window.location.pathname);
            
            // Multiple reload strategies for maximum reliability
            setTimeout(() => {
                // Strategy 1: Force reload with timestamp
                const timestamp = Date.now();
                window.location.href = window.location.pathname + '?cache_bust=' + timestamp;
            }, 50);
            
            // Fallback strategy if first doesn't work
            setTimeout(() => {
                window.location.reload(true);
            }, 200);
        }
        
        // Toggle manual timestamp field visibility
        function toggleManualTimestamp() {
            const checkbox = document.getElementById('manual_timestamp_override');
            const timestampGroup = document.getElementById('manual_timestamp_group');
            const timestampInput = document.getElementById('manual_timestamp');
            
            if (checkbox.checked) {
                timestampGroup.style.display = 'block';
                timestampInput.required = true;
                // Set default to current date and time
                const now = new Date();
                const localISOTime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                timestampInput.value = localISOTime;
            } else {
                timestampGroup.style.display = 'none';
                timestampInput.required = false;
                timestampInput.value = '';
            }
        }
    </script>
</body>
</html>
