<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}Route Optimizer{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <i data-feather="navigation"></i>
                Route Optimizer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.index') }}">
                            <i data-feather="home"></i>
                            Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <!-- Initialize Feather Icons -->
    <script>
        feather.replace();
        
        // Handle route generation with direct UI refresh
        function handleRouteGeneration(button) {
            // Update button state
            button.innerHTML = '<i data-feather="clock"></i> Generating...';
            button.disabled = true;
            
            // Set timeout fallback
            const timeout = setTimeout(() => {
                if (button.disabled) {
                    button.innerHTML = '<i data-feather="alert-circle"></i> Timeout - Try Again';
                    button.disabled = false;
                    feather.replace();
                }
            }, 15000);
            
            // Clear timeout when page starts to redirect
            window.addEventListener('beforeunload', () => {
                clearTimeout(timeout);
            });
        }
        
        // Immediate route refresh detection and reload
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('refresh') === 'routes') {
            console.log('Route refresh detected, forcing reload...');
            // Clear URL history immediately  
            window.history.replaceState({}, document.title, window.location.pathname);
            // Force hard reload to bypass all caching
            setTimeout(() => {
                window.location.href = window.location.pathname + '?bust=' + Date.now();
            }, 50);
        }
    </script>
</body>
</html>
